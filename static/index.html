<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premier Bank — Collections AI Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #111827;
      border-bottom: 1px solid #1e293b;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      color: #60a5fa;
      letter-spacing: -0.5px;
    }
    .logo span { color: #e2e8f0; }
    .badge {
      background: #1e40af;
      color: #93c5fd;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: #10b981;
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 6px #10b981;
    }
    .status-label { font-size: 0.75rem; color: #6b7280; }

    /* ── Layout ── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Chat ── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

    .msg {
      display: flex;
      gap: 0.75rem;
      max-width: 78%;
    }
    .msg.agent { align-self: flex-start; }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem;
      flex-shrink: 0;
      align-self: flex-end;
    }
    .agent .avatar { background: #1e40af; color: #93c5fd; }
    .user  .avatar { background: #374151; color: #d1d5db; }

    .bubble {
      padding: 0.75rem 1rem;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.92rem;
    }
    .agent .bubble {
      background: #1e293b;
      border-bottom-left-radius: 4px;
      color: #e2e8f0;
    }
    .user .bubble {
      background: #1e40af;
      border-bottom-right-radius: 4px;
      color: #dbeafe;
    }

    /* ── Tool indicators ── */
    .tool-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.9rem;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      font-size: 0.8rem;
      color: #60a5fa;
      align-self: flex-start;
      margin-left: 48px;
    }
    .tool-indicator.done { color: #10b981; border-color: #065f46; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #1e40af;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 0 0.25rem;
      align-self: flex-start;
    }
    .typing .dots {
      display: flex;
      gap: 4px;
      padding: 0.75rem 1rem;
      background: #1e293b;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }
    .dots span {
      width: 7px; height: 7px;
      background: #475569;
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Input area ── */
    .input-area {
      border-top: 1px solid #1e293b;
      background: #111827;
      padding: 1rem 1.25rem;
      flex-shrink: 0;
    }
    .quick-replies {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .qr-btn {
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #94a3b8;
      font-size: 0.78rem;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .qr-btn:hover { border-color: #3b82f6; color: #60a5fa; }
    .compose {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 0.92rem;
      padding: 0.75rem 1rem;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: #3b82f6; }
    textarea::placeholder { color: #475569; }
    button.send {
      background: #1d4ed8;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button.send:hover { background: #2563eb; }
    button.send:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }

    /* ── Account panel ── */
    .account-panel {
      width: 280px;
      border-left: 1px solid #1e293b;
      background: #111827;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .account-panel::-webkit-scrollbar { width: 4px; }
    .account-panel::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

    .panel-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #475569;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #1e293b;
    }

    .no-account {
      text-align: center;
      color: #334155;
      font-size: 0.85rem;
      padding: 2rem 0;
      line-height: 1.6;
    }
    .no-account .icon { font-size: 2rem; margin-bottom: 0.5rem; }

    .acct-name {
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    .acct-num {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 2px;
    }

    .balance-block {
      background: #0f172a;
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid #1e293b;
    }
    .balance-label { font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
    .balance-value { font-size: 1.6rem; font-weight: 700; color: #f87171; margin: 0.25rem 0; }
    .min-due { font-size: 0.78rem; color: #94a3b8; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid #0f172a;
      font-size: 0.8rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: #64748b; }
    .stat-value { color: #e2e8f0; font-weight: 500; }
    .stat-value.bad  { color: #f87171; }
    .stat-value.ok   { color: #fbbf24; }
    .stat-value.good { color: #10b981; }

    .risk-pill {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
    }
    .risk-Low    { background: #064e3b; color: #34d399; }
    .risk-Medium { background: #78350f; color: #fbbf24; }
    .risk-High   { background: #7f1d1d; color: #f87171; }

    .note-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 0.78rem;
      color: #64748b;
      border-left: 2px solid #1e40af;
      font-style: italic;
      line-height: 1.5;
    }

    .resolved-tag {
      background: #064e3b;
      color: #34d399;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      display: inline-block;
      margin-top: 0.25rem;
    }

    /* ── Tabs ── */
    .tab-bar { display: flex; gap: 0.25rem; margin-left: 1.5rem; }
    .tab {
      background: transparent; border: none; color: #64748b;
      padding: 0.35rem 0.9rem; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; font-weight: 500; transition: all 0.15s;
    }
    .tab:hover { background: #1e293b; color: #e2e8f0; }
    .tab.active { background: #1e40af; color: #dbeafe; }

    /* ── Outreach Queue ── */
    #outreachView {
      flex: 1; overflow-y: auto; padding: 1.5rem; background: #0b1120;
    }
    .outreach-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 1.25rem;
    }
    .outreach-title { font-size: 1.05rem; font-weight: 700; color: #f1f5f9; }
    .outreach-sub { font-size: 0.78rem; color: #64748b; margin-top: 0.2rem; }
    .refresh-btn {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
      padding: 0.4rem 0.9rem; border-radius: 8px; cursor: pointer;
      font-size: 0.82rem; font-weight: 500; transition: all 0.15s;
    }
    .refresh-btn:hover { border-color: #3b82f6; color: #60a5fa; }
    .outreach-grid { display: flex; flex-direction: column; gap: 1rem; max-width: 860px; }
    .candidate-card {
      background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 1.25rem;
    }
    .candidate-header {
      display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;
    }
    .candidate-name { font-size: 1rem; font-weight: 700; color: #f1f5f9; }
    .candidate-meta { font-size: 0.73rem; color: #475569; margin-top: 3px; }
    .stat-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .chip {
      background: #0f172a; border: 1px solid #1e293b; padding: 0.25rem 0.6rem;
      border-radius: 6px; font-size: 0.75rem; color: #94a3b8;
    }
    .chip.urgent { border-color: #7f1d1d; color: #f87171; background: #160404; }
    .chip.warning { border-color: #78350f; color: #fbbf24; background: #140c00; }
    .suggested-action {
      font-size: 0.78rem; color: #5eead4; font-style: italic; margin-bottom: 1rem;
      border-left: 2px solid #0d9488; padding-left: 0.6rem;
    }
    .outreach-controls { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .channel-select {
      background: #0f172a; border: 1px solid #1e293b; color: #e2e8f0;
      padding: 0.35rem 0.65rem; border-radius: 6px; font-size: 0.82rem;
    }
    .draft-btn {
      background: #1d4ed8; border: none; color: white; cursor: pointer;
      padding: 0.38rem 1rem; border-radius: 8px; font-size: 0.83rem;
      font-weight: 600; transition: background 0.15s;
    }
    .draft-btn:hover { background: #2563eb; }
    .draft-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
    .message-draft {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
      padding: 0.85rem; font-size: 0.83rem; color: #cbd5e1; line-height: 1.65;
      min-height: 60px; margin-top: 0.85rem; white-space: pre-wrap; display: none;
    }
    .dispatch-btn {
      background: #065f46; border: none; color: #6ee7b7; cursor: pointer;
      padding: 0.38rem 1rem; border-radius: 8px; font-size: 0.83rem;
      font-weight: 600; margin-top: 0.6rem; transition: background 0.15s; display: none;
    }
    .dispatch-btn:hover { background: #047857; }
    .dispatch-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
    .dispatched-tag {
      background: #064e3b; color: #34d399; font-size: 0.78rem; font-weight: 600;
      padding: 0.3rem 0.7rem; border-radius: 6px; display: inline-block; margin-top: 0.6rem;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Premier<span>Bank</span></div>
  <div class="badge">AI Collections</div>
  <div class="tab-bar">
    <button class="tab active" id="tabChat" onclick="switchTab('chat')">Chat</button>
    <button class="tab" id="tabOutreach" onclick="switchTab('outreach')">Outreach Queue</button>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:0.5rem">
    <div class="status-dot"></div>
    <span class="status-label">Alex — Online</span>
  </div>
</header>

<main>
<div id="chatView" style="display:flex;flex:1;overflow:hidden">
  <!-- Chat -->
  <div class="chat-panel">
    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="quick-replies" id="quickReplies">
        <button class="qr-btn" onclick="sendQuick('ACC001')">My account is ACC001</button>
        <button class="qr-btn" onclick="sendQuick('ACC002')">My account is ACC002</button>
        <button class="qr-btn" onclick="sendQuick('ACC003')">My account is ACC003</button>
        <button class="qr-btn" onclick="sendQuick('I lost my job recently and am struggling to make payments.')">I lost my job</button>
        <button class="qr-btn" onclick="sendQuick('Can we set up a payment plan?')">Payment plan</button>
        <button class="qr-btn" onclick="sendQuick('I have a medical emergency and cannot pay right now.')">Medical hardship</button>
      </div>
      <div class="compose">
        <textarea
          id="userInput"
          placeholder="Type your message..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send" id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Account Panel -->
  <div class="account-panel" id="accountPanel">
    <div class="panel-title">Customer Account</div>
    <div class="no-account" id="noAccount">
      <div class="icon">&#128274;</div>
      Account details will appear here once Alex looks up your information.
    </div>
    <div id="accountDetails" style="display:none;display:flex;flex-direction:column;gap:0.75rem"></div>
  </div>
</div><!-- /chatView -->

<div id="outreachView" style="display:none">
  <div class="outreach-header">
    <div>
      <div class="outreach-title">Proactive Outreach Queue</div>
      <div class="outreach-sub">Customers flagged for proactive financial wellness contact</div>
    </div>
    <button class="refresh-btn" onclick="loadCandidates()">Refresh</button>
  </div>
  <div class="outreach-grid" id="candidateList">
    <div style="color:#475569;text-align:center;padding:3rem 0">Select the Outreach Queue tab to load candidates.</div>
  </div>
</div>
</main>

<script>
  const conversationHistory = [];
  let isStreaming = false;

  // ── Boot: send initial greeting ──────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    sendToAgent([]);
  });

  // ── Message sending ──────────────────────────────────────────
  function sendQuick(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function sendMessage() {
    if (isStreaming) return;
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';

    addUserBubble(text);
    conversationHistory.push({ role: 'user', content: text });
    sendToAgent(conversationHistory);
  }

  // ── Core streaming call ──────────────────────────────────────
  async function sendToAgent(messages) {
    if (isStreaming) return;
    isStreaming = true;
    setInputEnabled(false);

    const typingEl = addTyping();
    let agentText = '';
    let agentBubble = null;
    let currentToolEl = null;

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          let event;
          try { event = JSON.parse(raw); } catch { continue; }

          if (event.type === 'text') {
            if (!agentBubble) {
              typingEl.remove();
              agentBubble = addAgentBubble('');
            }
            agentText += event.text;
            agentBubble.querySelector('.bubble').textContent = agentText;
            scrollToBottom();

          } else if (event.type === 'tool_start') {
            if (!agentBubble) {
              typingEl.remove();
              agentBubble = addAgentBubble('');
            }
            currentToolEl = addToolIndicator(event.tool, false);

          } else if (event.type === 'tool_result') {
            if (currentToolEl) {
              currentToolEl.classList.add('done');
              currentToolEl.querySelector('.spinner').style.display = 'none';
              currentToolEl.querySelector('span').textContent = toolLabel(event.tool) + ' — done';
            }
            if (event.tool === 'lookup_account' && event.data?.found) {
              renderAccountPanel(event.data);
            }

          } else if (event.type === 'done') {
            if (agentText) {
              conversationHistory.push({ role: 'assistant', content: agentText });
            }
          }
        }
      }
    } catch (err) {
      typingEl.remove();
      addAgentBubble('Sorry, there was a connection error. Please try again.');
      console.error(err);
    } finally {
      isStreaming = false;
      setInputEnabled(true);
      scrollToBottom();
    }
  }

  // ── DOM helpers ──────────────────────────────────────────────
  function addAgentBubble(text) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg agent';
    el.innerHTML = `
      <div class="avatar">AL</div>
      <div class="bubble">${escHtml(text)}</div>`;
    msgs.appendChild(el);
    scrollToBottom();
    return el;
  }

  function addUserBubble(text) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = `
      <div class="avatar">ME</div>
      <div class="bubble">${escHtml(text)}</div>`;
    msgs.appendChild(el);
    scrollToBottom();
  }

  function addTyping() {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'typing msg agent';
    el.innerHTML = `
      <div class="avatar">AL</div>
      <div class="dots"><span></span><span></span><span></span></div>`;
    msgs.appendChild(el);
    scrollToBottom();
    return el;
  }

  function addToolIndicator(toolName, done) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = `tool-indicator${done ? ' done' : ''}`;
    el.innerHTML = `<div class="spinner"></div><span>${toolLabel(toolName)}...</span>`;
    msgs.appendChild(el);
    scrollToBottom();
    return el;
  }

  function toolLabel(name) {
    const map = {
      lookup_account: 'Looking up account',
      create_payment_plan: 'Setting up payment plan',
      enroll_hardship_program: 'Enrolling in hardship program',
    };
    return map[name] || name;
  }

  function setInputEnabled(enabled) {
    document.getElementById('userInput').disabled = !enabled;
    document.getElementById('sendBtn').disabled = !enabled;
  }

  function scrollToBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
  }

  // ── Account panel ─────────────────────────────────────────────
  function renderAccountPanel(data) {
    document.getElementById('noAccount').style.display = 'none';
    const panel = document.getElementById('accountDetails');
    panel.style.display = 'flex';
    panel.style.flexDirection = 'column';
    panel.style.gap = '0.75rem';

    const daysColor = data.days_past_due > 60 ? 'bad' : data.days_past_due > 30 ? 'ok' : 'good';

    panel.innerHTML = `
      <div>
        <div class="acct-name">${data.name}</div>
        <div class="acct-num">${data.account_number} &middot; Since ${data.account_opened}</div>
      </div>

      <div class="balance-block">
        <div class="balance-label">Current Balance</div>
        <div class="balance-value">$${data.balance.toLocaleString('en-US', {minimumFractionDigits:2})}</div>
        <div class="min-due">Min. due: $${data.minimum_due.toLocaleString('en-US', {minimumFractionDigits:2})}</div>
      </div>

      <div>
        <div class="stat-row">
          <span class="stat-label">Days Past Due</span>
          <span class="stat-value ${daysColor}">${data.days_past_due} days</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Credit Limit</span>
          <span class="stat-value">$${data.credit_limit.toLocaleString()}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Interest Rate</span>
          <span class="stat-value">${data.interest_rate}% APR</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Last Payment</span>
          <span class="stat-value">$${data.last_payment.amount} on ${data.last_payment.date}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Risk Tier</span>
          <span class="stat-value"><span class="risk-pill risk-${data.risk_tier}">${data.risk_tier}</span></span>
        </div>
        ${data.hardship_enrolled ? '<div class="stat-row"><span class="stat-label">Hardship</span><span class="resolved-tag">Enrolled</span></div>' : ''}
      </div>

      <div>
        <div class="panel-title">Payment History</div>
        <div style="margin-top:0.4rem;font-size:0.8rem;color:#94a3b8;line-height:1.5">${data.payment_history}</div>
      </div>

      <div>
        <div class="panel-title">Agent Notes</div>
        <div class="note-box">${data.notes}</div>
      </div>

      <div>
        <div class="panel-title">Suggested Action</div>
        <div class="note-box" style="border-color:#0d9488;color:#5eead4">${data.suggested_action}</div>
      </div>
    `;
  }

  // ── Tab switching ─────────────────────────────────────────────
  function switchTab(tab) {
    const isChat = tab === 'chat';
    document.getElementById('chatView').style.display = isChat ? 'flex' : 'none';
    document.getElementById('outreachView').style.display = isChat ? 'none' : 'block';
    document.getElementById('tabChat').classList.toggle('active', isChat);
    document.getElementById('tabOutreach').classList.toggle('active', !isChat);
    if (!isChat) loadCandidates();
  }

  // ── Outreach Queue ────────────────────────────────────────────
  const _candidates = {};

  async function loadCandidates() {
    const list = document.getElementById('candidateList');
    list.innerHTML = '<div style="color:#475569;text-align:center;padding:3rem 0">Loading candidates...</div>';
    try {
      const res = await fetch('/outreach/candidates');
      const data = await res.json();
      list.innerHTML = '';
      if (!data.length) {
        list.innerHTML = '<div style="color:#475569;text-align:center;padding:3rem 0">No candidates require outreach right now.</div>';
        return;
      }
      data.forEach(c => {
        _candidates[c.account_number] = c;
        list.appendChild(buildCard(c));
      });
    } catch (e) {
      list.innerHTML = `<div style="color:#f87171;text-align:center;padding:2rem">Failed to load: ${e.message}</div>`;
    }
  }

  function buildCard(c) {
    const el = document.createElement('div');
    el.className = 'candidate-card';
    el.id = `card-${c.account_number}`;
    const dpd = c.days_past_due > 60 ? 'urgent' : c.days_past_due > 30 ? 'warning' : '';
    const hp  = c.hardship_probability != null ? Math.round(c.hardship_probability * 100) + '%' : '—';
    const pps = c.payment_propensity_score != null ? c.payment_propensity_score + '/100' : '—';
    const bucket = (c.delinquency_bucket || '').replace(/_/g, ' ').toUpperCase();
    const emailSel = c.best_contact_channel === 'email' ? 'selected' : '';
    const smsSel  = (c.best_contact_channel || '').includes('sms') ? 'selected' : '';
    const voiceSel = (c.best_contact_channel || '').includes('voice') ? 'selected' : '';

    el.innerHTML = `
      <div class="candidate-header">
        <div>
          <div class="candidate-name">${escHtml(c.name)}</div>
          <div class="candidate-meta">${c.account_number} &middot; ${bucket}</div>
        </div>
        <span class="risk-pill risk-${c.risk_tier}">${c.risk_tier}</span>
      </div>
      <div class="stat-chips">
        <span class="chip ${dpd}">${c.days_past_due} days past due</span>
        <span class="chip">$${c.balance.toLocaleString('en-US',{minimumFractionDigits:2})}</span>
        <span class="chip">Hardship: ${hp}</span>
        <span class="chip">Propensity: ${pps}</span>
        ${c.unprocessed_signals ? `<span class="chip warning">${c.unprocessed_signals} signal${c.unprocessed_signals !== 1 ? 's' : ''}</span>` : ''}
      </div>
      ${c.suggested_action ? `<div class="suggested-action">${escHtml(c.suggested_action)}</div>` : ''}
      <div class="outreach-controls">
        <select class="channel-select" id="ch-${c.account_number}">
          <option value="email" ${emailSel}>Email</option>
          <option value="sms" ${smsSel}>SMS</option>
          <option value="voice" ${voiceSel}>Voice Script</option>
        </select>
        <button class="draft-btn" id="draftBtn-${c.account_number}"
          onclick="draftMessage('${c.account_number}')">Draft Message</button>
      </div>
      <div class="message-draft" id="draft-${c.account_number}"></div>
      <button class="dispatch-btn" id="dispatchBtn-${c.account_number}"
        onclick="logDispatch('${c.account_number}')">Log Dispatch</button>
    `;
    return el;
  }

  async function draftMessage(acctNum) {
    const c = _candidates[acctNum];
    const channel = document.getElementById(`ch-${acctNum}`).value;
    const draftEl = document.getElementById(`draft-${acctNum}`);
    const draftBtn = document.getElementById(`draftBtn-${acctNum}`);
    const dispatchBtn = document.getElementById(`dispatchBtn-${acctNum}`);

    draftEl.textContent = '';
    draftEl.style.display = 'block';
    dispatchBtn.style.display = 'none';
    draftBtn.disabled = true;
    draftBtn.textContent = 'Drafting...';

    const payload = {
      account_number: acctNum,
      name: c.name,
      days_past_due: c.days_past_due,
      balance: c.balance,
      risk_tier: c.risk_tier,
      hardship_probability: c.hardship_probability || null,
      payment_propensity_score: c.payment_propensity_score || null,
      suggested_action: c.suggested_action || null,
      last_payment_date: c.last_payment?.date || null,
      channel,
    };

    let message = '';
    try {
      const res = await fetch('/outreach/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const ev = JSON.parse(line.slice(6).trim());
            if (ev.type === 'text') { message += ev.text; draftEl.textContent = message; }
          } catch {}
        }
      }
    } catch (e) {
      draftEl.textContent = 'Error generating message: ' + e.message;
    }

    draftBtn.disabled = false;
    draftBtn.textContent = 'Re-Draft';
    dispatchBtn.style.display = 'inline-block';
    dispatchBtn.dataset.message = message;
    dispatchBtn.dataset.channel = channel;
  }

  async function logDispatch(acctNum) {
    const btn = document.getElementById(`dispatchBtn-${acctNum}`);
    const message = btn.dataset.message;
    const channel = btn.dataset.channel;

    btn.disabled = true;
    btn.textContent = 'Logging...';

    try {
      const res = await fetch('/outreach/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account_number: acctNum, channel, message }),
      });
      const data = await res.json();
      if (data.success) {
        btn.outerHTML = `<span class="dispatched-tag">&#10003; ${escHtml(data.confirmation)}</span>`;
      } else {
        btn.disabled = false;
        btn.textContent = 'Retry';
        alert('Dispatch failed: ' + data.error);
      }
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Retry';
    }
  }
</script>
</body>
</html>
